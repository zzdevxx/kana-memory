      // -- Quiz Play --
      Router.on('#/quiz/play', (root, q) => {
        const mode = q.mode || 'hira';
        const cfg = QUIZ_MODES[mode] || QUIZ_MODES.hira;
        const total = 10;
        const state = { idx: 0, score: 0, streak: 0, current: null, locked: false, log: [] };

        function pickQuestion() {
          if (cfg.type === 'random') {
            const r = pick(ALL_CHARS);
            return { char: r[0], prompt: r[1], answer: r[0], options: makeOptions(r[0], ALL_CHARS), type: 'jp' };
          }
          if (cfg.type === 'romaji-to-jp') {
            const ans = weighted(cfg.dataset);
            const opts = [ans];
            let tries = 0;
            while (opts.length < 4 && tries < 50) {
              const r = pick(cfg.dataset);
              if (!opts.find(o => o[0] === r[0])) opts.push(r);
              tries++;
            }
            return { prompt: ans[1], answer: ans[0], options: shuffle(opts.map(o => o[0])), type: 'jp' };
          }
          if (cfg.type === 'jp-to-meaning') {
            const ans = weighted(cfg.dataset);
            const opts = [ans];
            let tries = 0;
            while (opts.length < 4 && tries < 50) {
              const r = pick(cfg.dataset);
              if (!opts.find(o => o[1] === r[1])) opts.push(r);
              tries++;
            }
            return { prompt: ans[0], answer: ans[1], options: shuffle(opts.map(o => o[1])), type: 'meaning' };
          }
          if (cfg.type === 'mixed') {
            const ans = weighted(cfg.dataset);
            const showChar = Math.random() > 0.5;
            if (showChar) {
              const opts = [ans];
              let tries = 0;
              while (opts.length < 4 && tries < 50) {
                const r = pick(cfg.dataset);
                if (!opts.find(o => o[1] === r[1])) opts.push(r);
                tries++;
              }
              return { prompt: ans[0], answer: ans[1], options: shuffle(opts.map(o => o[1])), type: 'meaning' };
            } else {
              const opts = [ans];
              let tries = 0;
              while (opts.length < 4 && tries < 50) {
                const r = pick(cfg.dataset);
                if (!opts.find(o => o[0] === r[0])) opts.push(r);
                tries++;
              }
              return { prompt: ans[1], answer: ans[0], options: shuffle(opts.map(o => o[0])), type: 'jp' };
            }
          }
        }

        function makeOptions(answer, pool) {
          const opts = [answer];
          let tries = 0;
          while (opts.length < 4 && tries < 50) {
            const r = pick(pool);
            if (!opts.includes(r[0])) opts.push(r[0]);
            tries++;
          }
          return shuffle(opts);
        }

        function weighted(dataset) {
          const weights = dataset.map(p => {
            const s = Stats.get(p[0]);
            return (s.wrong + 1) / (s.correct + 1);
          });
          const totalW = weights.reduce((a, b) => a + b, 0);
          let r = Math.random() * totalW;
          for (let i = 0; i < dataset.length; i++) { r -= weights[i]; if (r <= 0) return dataset[i]; }
          return dataset[dataset.length - 1];
        }

        function render() {
          if (state.idx >= total) {
            root.innerHTML = '<div class="screen-wrap">'
              + '<div class="screen-header">'
              + '<button class="back-btn" data-exit aria-label="Keluar">←</button>'

              + '</div>'

                + '<button class="btn btn-danger" data-confirm>Ya, Keluar</button>'
                + '</div>'
              );
              m2.querySelector('[data-cancel]').onclick = () => m2.remove();
              m2.querySelector('[data-confirm]').onclick = () => { m2.remove(); Router.go('#/quiz'); };
            };
            return;
          }
          state.current = pickQuestion();
          const dots = Array.from({ length: total }, (_, i) => '<div class="quiz-progress-dot ' + (i < state.idx ? 'done' : i === state.idx ? 'current' : '') + '"></div>').join('');
          root.innerHTML = '<div class="screen-wrap">'
            + '<div class="screen-header">'
            + '<button class="back-btn" data-exit aria-label="Keluar">←</button>'
            + '<h2 class="screen-title">' + esc(cfg.label) + '</h2>'
            + '<div style="min-width:70px;text-align:right;color:var(--text-dim);font-size:13px;font-weight:600;">' + (state.idx + 1) + '/' + total + '</div>'
            + '</div>'
            + '<div class="quiz-progress">' + dots + '</div>'
            + '<div class="scoreboard">'
            + '<div class="score"><span class="score-label">Skor</span><span class="score-value" data-score>' + state.score + '</span></div>'
            + '<div class="score-divider"></div>'
            + '<div class="score"><span class="score-label">Streak</span><span class="score-value">' + state.streak + '🔥</span></div>'
            + '</div>'
            + '<div class="quiz-card">'
            + '<div class="quiz-prompt">' + (state.current.type === 'meaning' ? 'Apa artinya?' : 'Pilih karakter yang cocok') + '</div>'
            + '<div class="quiz-char ' + (state.current.type === 'meaning' ? 'jp' : '') + '">' + esc(state.current.prompt) + '</div>'
            + '</div>'
            + '<div class="quiz-options">'
            + state.current.options.map(o => '<button class="quiz-option" data-ans="' + esc(o) + '">' + esc(o) + '</button>').join('')
            + '</div>'
            + '</div>';

          root.querySelectorAll('.quiz-option').forEach(btn => {
            btn.onclick = () => answer(btn, btn.dataset.ans === state.current.answer);
          });

          root.querySelector('[data-exit]').onclick = () => {
            const m2 = showModal(
              '<div class="modal-emoji">⚠️</div>'
              + '<h2 class="modal-title">Keluar dari kuis?</h2>'
              + '<p class="modal-text">Progres ' + (state.idx + 1) + '/' + total + ' soal akan hilang. Skor tidak akan tersimpan.</p>'
              + '<div class="modal-actions">'
              + '<button class="btn" data-cancel>Lanjut Kuis</button>'
              + '<button class="btn btn-danger" data-confirm>Ya, Keluar</button>'
              + '</div>'
            );
            m2.querySelector('[data-cancel]').onclick = () => m2.remove();
            m2.querySelector('[data-confirm]').onclick = () => { m2.remove(); Router.go('#/quiz'); };
          };
        }

        function answer(btn, ok) {
          if (state.locked) return;
          state.locked = true;
          state.log.push({ prompt: state.current.prompt, answer: state.current.answer, ok });
          root.querySelectorAll('.quiz-option').forEach(b => {
            b.disabled = true;
            if (b.dataset.ans === state.current.answer) b.classList.add('correct');
          });
          if (!ok) btn.classList.add('wrong');
          if (state.current.type === 'meaning') {
            // for "apa artinya", the character is the key
            const ch = (cfg.type === 'random' && HIRAGANA.concat(KATAKANA).find(k => k[1] === state.current.prompt)) ? null : state.current.prompt;
            if (ch) Stats.record(ch, ok);
          } else {
            Stats.record(state.current.answer, ok);
          }
          if (ok) {
            state.score++; state.streak++;
            if (state.streak >= 5) Achievements.unlock('streak_5');
            if (state.streak >= 10) Achievements.unlock('streak_10');
          } else { state.streak = 0; }
          const sv = root.querySelector('[data-score]'); if (sv) sv.textContent = state.score;
          setTimeout(() => { state.idx++; state.locked = false; render(); }, ok ? 700 : 1400);
        }

        function finish() {
          const isNew = Best.set('quiz_' + mode, state.score);
          Daily.complete(state.score);
          User.bumpDailyCounter('complete_quiz');
          DailyChallenge.complete('complete_quiz');
          const pct = state.score / total;
          const xpGain = state.score === total ? 50 : 30;
          const koinGain = state.score === total ? 25 : 10;
          User.addXP(xpGain); User.addKoin(koinGain);
          if (state.score === total) {
            Achievements.unlock('quiz_master');
            User.bumpDailyCounter('perfect_score');
            DailyChallenge.complete('perfect_score');
          }
          if (pct >= 0.8) Toast.show('Badge terbuka!', 'Skor ≥ 80%', '🎓');
          const wrongList = state.log.filter(l => !l.ok);
          const stars = state.score >= 9 ? 3 : state.score >= 7 ? 2 : 1;
          const heroEmoji = stars === 3 ? '🏆' : stars === 2 ? '✨' : '📚';
          const heroGrad = stars === 3 ? 'linear-gradient(135deg, #fbbf24, #f59e0b)' : stars === 2 ? 'linear-gradient(135deg, #a78bfa, #f472b6)' : 'linear-gradient(135deg, #64748b, #475569)';
          const title = stars === 3 ? 'Sempurna!' : stars === 2 ? 'Bagus!' : 'Terus Belajar!';
          const m2 = showModal(
            '<div class="quiz-result-hero" style="background:' + heroGrad + '">'
            + '<div class="confetti-host"></div>'
            + '<div class="quiz-result-emoji">' + heroEmoji + '</div>'
            + '<div class="quiz-stars">'
            + [1, 2, 3].map(i => '<span class="star ' + (i <= stars ? 'filled' : '') + '">★</span>').join('')
            + '</div></div>'
            + '<h2 class="modal-title" style="margin-top:4px">' + title + '</h2>'
            + '<p class="modal-text">Skor kamu: <strong>' + state.score + '/' + total + '</strong>'
            + (state.streak > 1 ? ' · <span style="color:var(--coin)">🔥 ' + state.streak + ' streak</span>' : '')
            + '</p>'
            + '<div class="reward-row">'
            + '<div class="reward-item">✨ +' + xpGain + ' XP</div>'
            + '<div class="reward-item">💰 +' + koinGain + ' koin</div>'

          + '<div style="min-width:70px"></div>'

          + '<div class="empty-msg">' + Achievements.data.length + ' dari ' + ACHIEVEMENTS.length + ' badge terbuka</div>'
          + '<div class="ach-grid">'
          + ACHIEVEMENTS.map(a => '<div class="ach ' + (Achievements.data.includes(a.id) ? 'unlocked' : 'locked') + '">'
            + '<div class="ach-icon">' + a.icon + '</div>'
            + '<div class="ach-name">' + esc(a.name) + '</div>'
            + '<div class="ach-desc">' + esc(a.desc) + '</div>'
            + '</div>').join('')
          + '</div></div>';
      });

      // -- Theme Shop --
      Router.on('#/themes', (root) => {
        const u = User.data;
        const themeKeys = Object.keys(THEMES);
        root.innerHTML = '<div class="screen-wrap">'
          + '<div class="screen-header">'
          + '<button class="back-btn" data-go="#/profile" aria-label="Kembali">←</button>'
          + '<h2 class="screen-title">🎨 Tema & Hadiah</h2>'
          + '<div style="min-width:70px"></div>'
          + '</div>'
          + '<div class="empty-msg">Koin: <strong style="color:var(--coin)">💰 ' + u.koin + '</strong> · Unlock tema baru!</div>'
          + '<div class="theme-grid">'
          + themeKeys.map(key => {
            const t = THEMES[key];
            const owned = u.unlockedThemes.includes(key);
            const active = u.activeTheme === key;
            let action = '';
            if (active) {
              action = '<button class="theme-action owned" disabled>✓ Aktif</button>';
            } else if (owned) {
              action = '<button class="theme-action activate" data-activate="' + key + '">Aktifkan</button>';
            } else {
              const canBuy = u.koin >= t.price;
              action = '<button class="theme-action buy" data-buy="' + key + '"' + (canBuy ? '' : ' disabled') + '>💰 ' + t.price + '</button>';
            }
            return '<div class="theme-card ' + (active ? 'active' : '') + ' ' + (owned ? '' : 'locked') + '">'
              + '<div class="theme-preview" style="background: linear-gradient(135deg, ' + t.primary + ', ' + t.accent + ');">'
              + '<div class="theme-preview-dot" style="background: ' + t.primary + '"></div>'
              + '<div class="theme-preview-dot" style="background: ' + t.accent + '"></div>'
              + '</div>'
              + '<div class="theme-name">' + esc(t.name) + '</div>'
              + '<div class="theme-price">' + (t.price === 0 ? 'Gratis' : '💰 ' + t.price + ' koin') + '</div>'
              + action
              + '</div>';
          }).join('')
          + '</div></div>';

        root.querySelectorAll('[data-activate]').forEach(b => b.onclick = () => {
          const key = b.dataset.activate;
          User.data.activeTheme = key;
          User.save();
          applyTheme(key);
          Router.go('#/themes');
          Toast.show('✓ Tema aktif', THEMES[key].name, '🎨');
          User.checkCompleteAchievements();
        });
        root.querySelectorAll('[data-buy]').forEach(b => {
          if (b.disabled) return;
          b.onclick = () => {
            const key = b.dataset.buy;
            const t = THEMES[key];
            if (User.data.koin < t.price) { Toast.show('Koin kurang', 'Butuh ' + t.price + ' koin', '⚠️'); return; }
            const m2 = showModal(
              '<div class="modal-emoji">🎨</div>'
              + '<h2 class="modal-title">Beli Tema ' + esc(t.name) + '?</h2>'
              + '<p class="modal-text">Harga: <strong style="color:var(--coin)">💰 ' + t.price + ' koin</strong><br>Koin kamu saat ini: <strong>' + User.data.koin + '</strong></p>'
              + '<div class="modal-actions">'
              + '<button class="btn" data-cancel>Batal</button>'
              + '<button class="btn btn-primary" data-confirm>Beli & Aktifkan</button>'
              + '</div>'
            );
            m2.querySelector('[data-cancel]').onclick = () => m2.remove();
            m2.querySelector('[data-confirm]').onclick = () => {
              User.addKoin(-t.price);
              if (!User.data.unlockedThemes.includes(key)) User.data.unlockedThemes.push(key);
              User.data.activeTheme = key;
              User.save();
              applyTheme(key);
              m2.remove();
              Router.go('#/themes');
              Toast.show('✓ Tema di-unlock!', t.name, '🎨');
              User.checkCompleteAchievements();
            };
          };
        });
      });

      // -- Settings --
      Router.on('#/settings', (root) => {
        const s = Settings.data;
        const bestEntries = Object.entries(Best.data);
        const u = User.data;
        root.innerHTML = '<div class="screen-wrap">'
          + '<div class="screen-header">'
          + '<h2 class="screen-title">Pengaturan</h2>'
          + '</div>'

          + '<div class="menu-list" style="margin-bottom:16px">'
          + '<div class="menu-list-item" data-menu-pair>'
          + '<div class="mli-icon">🎴</div><div class="mli-label">Pasangan Kartu</div>'
          + '<div class="mli-arrow">' + s.difficulty + ' ›</div>'
          + '</div>'
          + '<div class="menu-list-item" data-go="#/about">'
          + '<div class="mli-icon">ℹ️</div><div class="mli-label">Tentang Aplikasi</div>'
          + '<div class="mli-arrow">›</div>'
          + '</div>'
          + '<div class="menu-list-item" data-go="#/about-me">'
          + '<div class="mli-icon">👨‍💻</div><div class="mli-label">Tentang Pengembang</div>'
          + '<div class="mli-arrow">›</div>'
          + '</div>'
          + '</div>'

          + '<div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border);text-align:center">'
          + '<button class="btn btn-danger" style="width:100%;max-width:280px;padding:12px 20px;font-size:14px" data-reset>Reset &amp; Mulai Ulang</button>'
          + '</div>'

          + '</div>';

        const menuPairBtn = root.querySelector('[data-menu-pair]');
        if (menuPairBtn) menuPairBtn.onclick = () => {
          let newDiff = s.difficulty;
          const m3 = showModal(
            '<div style="font-size:48px;line-height:1;margin-bottom:6px">🎴</div>'
            + '<h2 class="modal-title">Pasangan Kartu</h2>'
            + '<p class="modal-text" style="margin-bottom:12px">Pilih jumlah pasangan kartu untuk game memory.</p>'
            + '<div class="settings-group" style="text-align:left;margin:0 0 4px">'
            + '<div class="settings-group-title">Jumlah Pasangan</div>'
            + '<div class="picker" id="menuPairPicker" style="margin-bottom:0">'
            + [4, 6, 8, 10, 12].map(d => '<button class="picker-btn ' + (s.difficulty === d ? 'active' : '') + '" data-d="' + d + '">' + d + '</button>').join('')
            + '</div></div>'
            + '<div style="font-size:12px;color:var(--text-dim);margin-top:14px;line-height:1.5;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px">'
            + '💡 <strong style="color:var(--text)">Tips:</strong> 4&ndash;6 pair untuk pemula, 8&ndash;12 pair untuk tantangan.'
            + '</div>'
            + '<div class="modal-actions" style="margin-top:18px">'
            + '<button class="btn" data-cancel>Batal</button>'
            + '<button class="btn btn-primary" data-save>Simpan</button>'
            + '</div>'
          );
          m3.querySelectorAll('#menuPairPicker .picker-btn').forEach(b => b.onclick = () => {
            m3.querySelectorAll('#menuPairPicker .picker-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            newDiff = parseInt(b.dataset.d, 10);
          });
          m3.querySelector('[data-cancel]').onclick = () => m3.remove();
          m3.querySelector('[data-save]').onclick = () => {
            if (newDiff !== s.difficulty) {
              s.difficulty = newDiff;
              Settings.save();
              Toast.show('✓ Tersimpan', 'Jumlah pair: ' + newDiff, '🎴');
            }
            m3.remove();
            Router.go('#/settings');
          };
        };
        root.querySelector('[data-reset]').onclick = () => {
          const m2 = showModal(
            '<div class="modal-emoji">⚠️</div>'
            + '<h2 class="modal-title">Reset semua progress?</h2>'
            + '<p class="modal-text">Level, koin, stats, achievements, best score, dan streak akan dihapus permanen.</p>'
            + '<div class="modal-actions">'
            + '<button class="btn" data-cancel>Batal</button>'
            + '<button class="btn btn-danger" data-confirm>Ya, Reset</button>'
            + '</div>'
          );
          m2.querySelector('[data-cancel]').onclick = () => m2.remove();
          m2.querySelector('[data-confirm]').onclick = () => {
            Store.clearAll();
            m2.remove();
            Toast.show('✓ Direset', 'Semua progress dihapus');
            Router.go('#/onboard');
          };
        };
      });

      // -- About --
      Router.on('#/about', (root) => {
        root.innerHTML = '<div class="screen-wrap">'
          + '<div class="screen-header">'
          + '<button class="back-btn" data-go="#/profile" aria-label="Kembali">←</button>'
          + '<h2 class="screen-title">Tentang</h2>'
          + '<div style="min-width:70px"></div>'
          + '</div>'
          + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;line-height:1.7">'
          + '<div class="text-center" style="font-size:48px" class="jp">仮</div>'
          + '<h3 class="text-center" style="font-size:18px;margin:8px 0">Kana Memory v3.0</h3>'
          + '<p class="text-center" style="color:var(--text-dim);font-size:14px">Belajar Huruf Jepang dengan Cara Menyenangkan</p>'
          + '<p style="color:var(--text-dim);font-size:13px;margin-top:16px">Aplikasi single-file offline untuk pemula bahasa Jepang. Fokus pada Hiragana, Katakana, Kanji N5, dan kosakata dasar.</p>'
          + '<h3 style="margin:16px 0 8px;font-size:13px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px">Fitur</h3>'
          + '<p style="color:var(--text-dim);font-size:13px">✓ 4 mode Memory Game (Hira, Kata, Kosakata, Campuran)<br>✓ 5 mode Kuis dengan sistem adaptif<br>✓ Belajar dengan audio pelafalan (Web Speech)<br>✓ 13 achievement & badge<br>✓ Sistem XP, level, koin<br>✓ Tantangan harian<br>✓ 4 tema warna unlock<br>✓ Bottom navigation mobile-first</p>'
          + '<h3 style="margin:16px 0 8px;font-size:13px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px">Stack</h3>'
          + '<p style="color:var(--text-dim);font-size:13px">HTML5 + Vanilla CSS + Vanilla JS. Zero dependency. Font: Inter, Shippori Mincho, Noto Sans JP. Cocok untuk Capacitor Android (offline).</p>'
          + '<p class="text-center" style="margin-top:20px;font-size:11px;color:var(--text-faint)">「楽しく学ぼう！」 Made with ❤️</p>'
          + '</div></div>';
      });

      // -- About Me / Team --
      Router.on('#/about-me', (root) => {
        root.innerHTML = '<div class="screen-wrap">'
          + '<div class="screen-header">'
          + '<button class="back-btn" data-go="#/profile" aria-label="Kembali">←</button>'
          + '<h2 class="screen-title">Pengembang &amp; Tim</h2>'
          + '<div style="min-width:70px"></div>'
          + '</div>'
          + '<div style="background:linear-gradient(135deg, var(--primary), var(--accent));border-radius:var(--radius);padding:24px 20px;text-align:center;color:white;margin-bottom:14px;position:relative;overflow:hidden">'
          + '<div style="font-size:52px;line-height:1;margin-bottom:8px;position:relative">👨‍💻</div>'
          + '<div style="font-size:12px;opacity:0.9;font-weight:700;text-transform:uppercase;letter-spacing:1px;position:relative">Lead Developer / Programmer</div>'
          + '<div style="font-size:19px;font-weight:800;margin-top:3px;position:relative">Andreas Restuawanta Christwara</div>'
          + '<div style="font-size:12px;opacity:0.85;margin-top:3px;position:relative">NIM 5312422036 &middot; Teknik Komputer</div>'
          + '</div>'
          + '<div class="menu-list">'
          + '<div class="menu-list-item" style="cursor:default;align-items:flex-start;padding:14px 16px">'
          + '<div class="mli-icon" style="font-size:22px">💡</div>'
          + '<div style="flex:1;min-width:0">'
          + '<div style="font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:0.5px">Ide &amp; Konseptor Materi</div>'
          + '<div style="font-size:14px;font-weight:800;color:var(--text);margin-top:2px">Yureike Christiani Ismawan Bendon</div>'
          + '<div style="font-size:12px;color:var(--text-dim);margin-top:2px">NIM 2302070004 &middot; Pendidikan Bahasa Jepang</div>'
          + '</div>'
          + '</div>'
          + '</div>'
          + '<p class="text-center" style="margin-top:20px;font-size:11px;color:var(--text-faint)">「日本語を楽しく学ぼう！」 &middot; Made with ❤️</p>'
          + '</div>';
      });

      /* ============================================================
         BOOT
         ============================================================ */
      Audio.init();
      applyTheme(User.data.activeTheme);
      Router.handle();
    })();
  </script>
</body>
